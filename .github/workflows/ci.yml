name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python-compatibility:
    name: Python ${{ matrix.python-version }} compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e ".[dev,notebooks]"

      - name: Test
        run: pytest

      - name: Execute notebooks
        run: make notebooks-check

  test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e ".[dev,notebooks]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest --cov=mlops_demo --cov-report=term-missing --cov-report=xml

      - name: Execute notebooks
        run: make notebooks-check

      - name: Exercise release training
        run: python -m mlops_demo.train

      - name: Build runtime image
        run: docker build -t mlops-iris-demo:${{ github.sha }} .

      - name: Build guided UI image
        run: docker build --target ui-runtime -t mlops-iris-ui:${{ github.sha }} .

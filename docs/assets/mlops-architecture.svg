<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="title description">
  <title id="title">End-to-end MLOps architecture</title>
  <description id="description">Data is validated, used for tracked training, evaluated by a quality gate, packaged as a model artifact, served through an API and guided interface, and observed through prediction logging and drift detection.</description>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080a09"/>
      <stop offset="0.55" stop-color="#0d120e"/>
      <stop offset="1" stop-color="#152017"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#76b900"/>
      <stop offset="1" stop-color="#9add00"/>
    </linearGradient>
    <linearGradient id="success" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9add00"/>
      <stop offset="1" stop-color="#76b900"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#020617" flood-opacity="0.36"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#667067"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#76b900"/>
    </marker>
    <style>
      .title { font: 700 42px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f8fafc; letter-spacing: -1px; }
      .subtitle { font: 400 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #9aa39b; }
      .number { font: 700 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #9add00; letter-spacing: 1.6px; }
      .card-title { font: 700 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f8fafc; }
      .card-body { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #9aa39b; }
      .small-title { font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f8fafc; }
      .small-body { font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #9aa39b; }
      .label { font: 600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #9add00; letter-spacing: 1px; }
    </style>
  </defs>

  <rect width="1600" height="800" rx="28" fill="url(#background)"/>
  <circle cx="1450" cy="70" r="220" fill="#76b900" opacity="0.10"/>
  <circle cx="90" cy="760" r="250" fill="#76b900" opacity="0.05"/>

  <text x="76" y="78" class="title">A small, inspectable MLOps loop</text>
  <text x="76" y="112" class="subtitle">One traceable path from validated data to a monitored user prediction</text>

  <!-- Primary lifecycle -->
  <g filter="url(#shadow)">
    <rect x="74" y="190" width="244" height="168" rx="12" fill="#111512" stroke="#343b35"/>
    <rect x="74" y="190" width="5" height="168" rx="3" fill="#76b900"/>
    <text x="102" y="226" class="number">01 · DATA</text>
    <text x="102" y="267" class="card-title">Validate</text>
    <text x="102" y="298" class="card-body">Schema · missing values</text>
    <text x="102" y="321" class="card-body">Class balance · constraints</text>

    <rect x="374" y="190" width="244" height="168" rx="12" fill="#111512" stroke="#343b35"/>
    <rect x="374" y="190" width="5" height="168" rx="3" fill="#76b900"/>
    <text x="402" y="226" class="number">02 · LEARN</text>
    <text x="402" y="267" class="card-title">Train &amp; track</text>
    <text x="402" y="298" class="card-body">Seeded pipeline · 5-fold CV</text>
    <text x="402" y="321" class="card-body">Parameters · metrics · MLflow</text>

    <rect x="674" y="190" width="244" height="168" rx="12" fill="#111512" stroke="#76b900"/>
    <rect x="674" y="190" width="5" height="168" rx="3" fill="url(#accent)"/>
    <text x="702" y="226" class="number">03 · DECIDE</text>
    <text x="702" y="267" class="card-title">Quality gate</text>
    <text x="702" y="298" class="card-body">Held-out evidence</text>
    <text x="702" y="321" class="card-body">Approve or stop the release</text>

    <rect x="974" y="190" width="244" height="168" rx="12" fill="#111512" stroke="#343b35"/>
    <rect x="974" y="190" width="5" height="168" rx="3" fill="#8fd600"/>
    <text x="1002" y="226" class="number">04 · PACKAGE</text>
    <text x="1002" y="267" class="card-title">Model bundle</text>
    <text x="1002" y="298" class="card-body">Estimator · feature contract</text>
    <text x="1002" y="321" class="card-body">Baseline · run metadata</text>

    <rect x="1274" y="190" width="244" height="168" rx="12" fill="#111512" stroke="#343b35"/>
    <rect x="1274" y="190" width="5" height="168" rx="3" fill="#f59e0b"/>
    <text x="1302" y="226" class="number">05 · SERVE</text>
    <text x="1302" y="267" class="card-title">Predict</text>
    <text x="1302" y="298" class="card-body">FastAPI · Streamlit</text>
    <text x="1302" y="321" class="card-body">Health · probabilities · logs</text>
  </g>

  <g fill="none" stroke="#667067" stroke-width="3" marker-end="url(#arrow)">
    <path d="M 319 274 L 363 274"/>
    <path d="M 619 274 L 663 274"/>
    <path d="M 919 274 L 963 274"/>
    <path d="M 1219 274 L 1263 274"/>
  </g>

  <!-- Gate outcomes -->
  <path d="M 796 359 L 796 424" fill="none" stroke="#ef4444" stroke-width="3" stroke-dasharray="7 7" marker-end="url(#arrow)"/>
  <rect x="682" y="434" width="228" height="62" rx="15" fill="#2a1720" stroke="#7f1d1d"/>
  <circle cx="715" cy="465" r="10" fill="#ef4444"/>
  <text x="739" y="461" class="small-title">Failed gate</text>
  <text x="739" y="481" class="small-body">Stop release · retain evidence</text>

  <!-- Observability loop -->
  <text x="75" y="569" class="label">OBSERVABILITY &amp; FEEDBACK</text>
  <g filter="url(#shadow)">
    <rect x="74" y="596" width="312" height="124" rx="12" fill="#111512" stroke="#343b35"/>
    <circle cx="112" cy="634" r="18" fill="#26351e"/>
    <path d="M 104 634 h16 M 112 626 v16" stroke="#9add00" stroke-width="2.5" stroke-linecap="round"/>
    <text x="144" y="637" class="small-title">Runtime metrics</text>
    <text x="102" y="674" class="small-body">Latency · request totals · health</text>
    <text x="102" y="697" class="small-body">Prometheus-ready endpoint</text>

    <rect x="480" y="596" width="312" height="124" rx="12" fill="#111512" stroke="#343b35"/>
    <circle cx="518" cy="634" r="18" fill="#163b32"/>
    <path d="M 510 628 h16 M 510 634 h12 M 510 640 h16" stroke="#62d8b6" stroke-width="2.5" stroke-linecap="round"/>
    <text x="550" y="637" class="small-title">Prediction events</text>
    <text x="508" y="674" class="small-body">Features · probabilities · model run</text>
    <text x="508" y="697" class="small-body">Structured JSONL contract</text>

    <rect x="886" y="596" width="312" height="124" rx="12" fill="#111512" stroke="#343b35"/>
    <circle cx="924" cy="634" r="18" fill="#064e3b"/>
    <path d="M 915 640 l7 -8 l6 5 l8 -12" fill="none" stroke="#6ee7b7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="956" y="637" class="small-title">Drift monitor</text>
    <text x="914" y="674" class="small-body">Live means vs training baseline</text>
    <text x="914" y="697" class="small-body">Explainable threshold and result</text>

    <rect x="1292" y="596" width="226" height="124" rx="12" fill="#16210f" stroke="#527f16"/>
    <circle cx="1330" cy="634" r="18" fill="#395d0d"/>
    <path d="M 1321 634 l6 6 l12 -14" fill="none" stroke="#d9ff9e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1362" y="637" class="small-title">Action</text>
    <text x="1320" y="674" class="small-body">Observe · investigate</text>
    <text x="1320" y="697" class="small-body">Improve the next run</text>
  </g>

  <g fill="none" stroke="#76b900" stroke-width="3" marker-end="url(#arrowAccent)">
    <path d="M 386 658 L 469 658"/>
    <path d="M 792 658 L 875 658"/>
    <path d="M 1198 658 L 1281 658"/>
  </g>
  <path d="M 1405 585 C 1405 510 1398 452 1398 370" fill="none" stroke="url(#success)" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrowAccent)"/>
</svg>

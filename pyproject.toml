[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mlops-iris-demo"
version = "0.2.0"
description = "A compact, end-to-end MLOps reference project using scikit-learn, MLflow, FastAPI, and Docker."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "darren236" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "fastapi>=0.115,<1",
  "joblib>=1.4,<2",
  "numpy>=2.0,<3",
  "pandas>=2.2,<4",
  "prometheus-client>=0.21,<1",
  "pydantic>=2.9,<3",
  "scikit-learn>=1.5,<2",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
train = ["mlflow>=2.17,<4"]
media = [
  "pillow>=12,<13",
  "playwright>=1.56,<2",
]
notebooks = [
  "jupyterlab>=4.3,<5",
  "matplotlib>=3.9,<4",
  "mlflow>=2.17,<4",
]
ui = [
  "mlflow>=2.17,<4",
  "streamlit>=1.64,<2",
]
dev = [
  "httpx>=0.27,<1",
  "mlflow>=2.17,<4",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
  "streamlit>=1.64,<2",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["mlops_demo"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
